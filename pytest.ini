[pytest]
# The fixture corpora under skills/work/fixtures/ are inputs to the verifiers,
# not part of this repo's own suite. known_fake/ is deliberately green and
# deliberately fake — collecting it would report passing tests for code we
# maintain precisely because it is broken. The verifiers run these directories
# themselves, in a temp copy, and assert the verdicts.
norecursedirs =
    skills/work/fixtures/known_fake
    skills/work/fixtures/known_good
    .git
    .upstream
    node_modules
    __pycache__

testpaths = tests skills
